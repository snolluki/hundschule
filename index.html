<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hundeschule · Pair Programming</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --text:#1f2937; --muted:#6b7280; --line:#e2e5ea;
  --accent:#2563eb; --accent-soft:#e0eaff; --ok:#15803d; --ok-soft:#dcfce7;
  --lock:#9ca3af; --warn-soft:#fff7e0; --warn:#92600a; --bad:#b91c1c; --bad-soft:#fde8e8;
  --driver:#1d4ed8; --driver-soft:#dbeafe; --nav:#b45309; --nav-soft:#fef3c7; --test:#6d28d9; --test-soft:#ede9fe;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:17px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none !important}
code,.mono{font-family:Consolas,"Cascadia Mono","Courier New",monospace}

header.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
header.top h1{font-size:1.1rem;margin:0 auto 0 0}
.linkbtn{background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;padding:4px;font-size:.92rem}

.wrap{max-width:820px;margin:0 auto;padding:16px 14px 50px;display:grid;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{font-size:1.1rem;margin:0 0 10px}
.card p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 14px;cursor:pointer;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.input{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel);width:100%}
label.f{display:block;margin:0 0 10px;font-weight:600}
label.f .input{margin-top:4px;font-weight:400}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:12px;z-index:100;max-width:92vw;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad)}
.big-msg{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:20px}
.big-msg h2{margin:0}
.note{padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.okbox{padding:10px 12px;border-radius:10px;background:var(--ok-soft);color:var(--ok);font-weight:600}

/* Rollen */
.rolle{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700;font-size:.85rem}
.rolle.Driver{background:var(--driver-soft);color:var(--driver)}
.rolle.Navigator{background:var(--nav-soft);color:var(--nav)}
.rolle.Tester{background:var(--test-soft);color:var(--test)}
.rollen{display:grid;gap:10px}
.rollenzeile{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rollenzeile .wer{font-size:1.35rem;font-weight:800;min-width:7em}
.rollenzeile .rolle{font-size:1.05rem;padding:4px 14px}
.rollenzeile .was{color:var(--muted);font-size:.95rem}
.regeln{margin:10px 0 0;padding-left:1.2em;color:var(--muted);font-size:.95rem}

/* Listen */
.liste{display:grid;gap:8px}
.wahl{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel);cursor:pointer;text-align:left;width:100%}
.wahl:hover{border-color:var(--accent)}
.wahl:disabled{cursor:not-allowed;opacity:.55}
.wahl b{font-size:1.02rem}
.gtab{width:100%;border-collapse:collapse}
.gtab td,.gtab th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:middle}
.gtab th{font-size:.85rem;color:var(--muted);font-weight:600}
.gtab tr.ich td{background:var(--accent-soft)}
.haken{color:var(--ok);font-weight:800}
.offen{color:var(--muted)}

/* Geräte */
.geraete{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.geraete{grid-template-columns:1fr}}
.geraet{border:2px solid var(--line);border-radius:14px;padding:10px;background:var(--panel);cursor:pointer;text-align:center}
.geraet img{width:84px;height:84px;display:block;margin:0 auto 4px}
.geraet b{display:block;font-size:1.1rem}
.geraet .st{color:#ca8a04;letter-spacing:2px}
.geraet .small{display:block}
.geraet .wer{display:block;font-size:.85rem;color:var(--muted);min-height:1.2em}
.geraet.mein{border-color:var(--ok);background:var(--ok-soft)}
.geraet:disabled{cursor:not-allowed;opacity:.5}

.dialog{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.dialog .card{max-width:860px;width:100%;max-height:92vh;display:flex;flex-direction:column}
.dialog textarea{width:100%;min-height:340px;flex:1;font-family:Consolas,"Courier New",monospace;font-size:.92rem;padding:10px;border:1px solid var(--line);border-radius:10px;resize:vertical}
.dialog pre{margin:0;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:.88rem;flex:1}
.fehler{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--bad-soft);color:var(--bad);font-weight:600}

/* ---------- Lehrkraft ---------- */
body.lk .wrap{max-width:1400px}
.lkbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.schalter{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--bg);cursor:pointer;min-height:42px;font-weight:600;user-select:none}
.schalter.an{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.schalter .pkt{width:12px;height:12px;border-radius:50%;background:var(--lock)}
.schalter.an .pkt{background:var(--ok)}
.url{font-size:1.25rem;font-weight:800;word-break:break-all}
.stat{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted)}
.stat b{color:var(--text)}
.gcards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(400px,1fr))}
@media (max-width:460px){.gcards{grid-template-columns:1fr}}
.gcard h3{margin:0 0 6px;font-size:1.15rem;display:flex;gap:8px;align-items:center;justify-content:space-between}
.gcard h3 .gname{cursor:pointer}
.ptab{width:100%;border-collapse:collapse;font-size:.95rem}
.ptab td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:middle}
.ptab td.namen{line-height:1.7}
.ptab select{padding:4px;border-radius:8px;border:1px solid var(--line);background:var(--panel);max-width:150px}
.prow{border-top:1px solid var(--line);padding:8px 0;display:grid;gap:6px}
.pnamen{display:flex;flex-wrap:wrap;gap:4px 14px}
.pn{white-space:nowrap;font-weight:600}
.pctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pctl select{padding:4px;border-radius:8px;border:1px solid var(--line);background:var(--panel);max-width:150px}
.pctl .rechts{margin-left:auto;display:flex;gap:6px;align-items:center}
a.btn,a.mini{text-decoration:none;display:inline-flex;align-items:center}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:3px 8px;cursor:pointer;font-size:.85rem;min-height:30px}
.mini.bad{color:var(--bad)}
.fortschritt{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:4px 0 8px}
.fortschritt span{display:block;height:100%;background:var(--ok)}
.menu{position:relative}
.menu .pop{position:absolute;right:0;top:110%;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:6px;display:grid;gap:4px;min-width:250px;z-index:30}
.menu .pop button{text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer}
.menu .pop button:hover{background:var(--bg)}
/* Hilfen */
.hilfe{border-top:1px solid var(--line);padding:10px 0}
.hilfe:first-of-type{border-top:0}
.hilfe .kopf{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hilfe .kopf b{margin-right:auto}
.hilfe .txt{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:.97rem}
.hilfe .txt.h2{background:var(--warn-soft)}
.hilfe .txt code{background:rgba(255,255,255,.7);padding:0 3px;border-radius:4px}
details.fm summary{cursor:pointer;font-weight:700;padding:8px 0}
.fmtab{width:100%;border-collapse:collapse;font-size:.92rem}
.fmtab td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}
.fmtab td:first-child{font-family:Consolas,"Courier New",monospace;width:42%}
.symbol{width:28px;height:28px;vertical-align:middle;margin-right:4px}
.phase{display:inline-block;padding:4px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700}
/* Beameransicht */
.nurbeamer{display:none}
body.beamer .nurbeamer{display:inline}
body.beamer{font-size:21px}
body.beamer .nurlk{display:none !important}
body.beamer .gcards{grid-template-columns:repeat(auto-fill,minmax(440px,1fr))}
body.beamer .url{font-size:2rem}
</style>
</head>
<body>
<div id="app"></div>
<script src="/socket.io/socket.io.js" onerror="window.__ohneServer=true"></script>
<script>
(function () {
'use strict';

var BESCHREIBUNG = {
  Driver: 'tippt und sagt laut, was er schreibt und warum',
  Navigator: 'liest die Aufgabe vor, prüft mit Quelltext und Hilfen, notiert',
  Tester: 'probiert in Greenfoot aus und prüft im Inspektor'
};

/* ---------------- Hilfsfunktionen ---------------- */
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var speicher = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del: function (k) { try { localStorage.removeItem(k); } catch (e) {} },
  getJSON: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  setJSON: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
var toastT = null;
function toast(msg, bad) {
  var el = $('.toast') || document.body.appendChild(document.createElement('div'));
  el.className = 'toast' + (bad ? ' bad' : '');
  el.textContent = msg;
  clearTimeout(toastT);
  toastT = setTimeout(function () { el.remove(); }, bad ? 6000 : 3500);
}
function uhr(ms) { if (!ms) return ''; var d = new Date(ms); return d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2); }
function namenText(p) { return p.namen.join(' & '); }
function rollenHTML(p) {
  return p.namen.map(function (n, i) { return esc(n) + ' <span class="rolle ' + p.rollen[i] + '">' + p.rollen[i] + '</span>'; }).join('<br>');
}
function klasseInfo(z, name) { return z.klassen.filter(function (k) { return k.name === name; })[0] || null; }
function dialog(html) {
  var d = document.createElement('div');
  d.className = 'dialog';
  d.innerHTML = '<div class="card">' + html + '</div>';
  d.addEventListener('click', function (e) { if (e.target === d) d.remove(); });
  document.body.appendChild(d);
  return d;
}
function keinServer() {
  $('#app').innerHTML = '<div class="big-msg"><h2>Kein Server</h2><p>Das Online-Tool funktioniert nur, wenn es über den Server (Render) geöffnet wird.</p></div>';
}
/* Gestufte Hilfen je Hindernis (Anhang EF-III_C_Artikulationsschema). Hilfe 2 erst nach Hilfe 1. */
var THEMEN = [
  { id: 'anlegen', titel: 'Klasse anlegen' },
  { id: 'attribute', titel: 'Attribute' },
  { id: 'entscheidung', titel: 'Konstruktor: Was gibt man beim Erzeugen an?' },
  { id: 'konstruktor', titel: 'Konstruktor schreiben' },
  { id: 'methoden', titel: 'Methoden' },
  { id: 'testen', titel: 'Testen' }
];
var WORTE = {
  Huerde: { jede: 'jeder Hürde', jedeNeu: 'jeder neuen Hürde', zwei: 'zwei Hürden', eine: 'eine Hürde' },
  Tunnel: { jede: 'jedem Tunnel', jedeNeu: 'jedem neuen Tunnel', zwei: 'zwei Tunnel', eine: 'einen Tunnel' },
  Slalom: { jede: 'jedem Slalom', jedeNeu: 'jedem neuen Slalom', zwei: 'zwei Slaloms', eine: 'einen Slalom' }
};
var ERSTES_ATTRIBUT = { Huerde: 'private int hoehe;', Tunnel: 'private int laenge;', Slalom: 'private String bezeichnung;' };
var METHODEN_H2 = {
  Huerde: 'Eine Zahl wird größer: <code>hoehe = hoehe + 10;</code><br>Ein Wahrheitswert wird gesetzt: <code>abgeworfen = true;</code><br>Jede Methode beginnt mit <code>public void</code>, zum Beispiel <code>public void abwerfen()</code>.',
  Tunnel: 'Eine Zahl wird größer: <code>durchlaeufe = durchlaeufe + 1;</code><br>Ein Wahrheitswert wird gesetzt: <code>gebogen = true;</code><br>Jede Methode beginnt mit <code>public void</code>, zum Beispiel <code>public void biegen()</code>.',
  Slalom: 'Eine Zahl wird größer: <code>anzahlStangen = anzahlStangen + 1;</code><br>Die Methode <code>abstandEinstellen</code> bekommt – wie <code>laufen(int pSchritte)</code> bei <code>Hund</code> – einen Parameter: <code>public void abstandEinstellen(int pAbstand)</code>. Darin steht <code>abstand = pAbstand;</code>'
};
function hilfeText(klasse, bild, thema, stufe) {
  var w = WORTE[klasse];
  var t = {
    anlegen: [
      'Klickt im Klassenfenster rechts mit der rechten Maustaste auf <code>Actor</code> – nicht auf <code>Hund</code> – und wählt „Neue Unterklasse …“.',
      'Der Name heißt genau <code>' + klasse + '</code>: großer Anfangsbuchstabe, ohne Umlaut. Wählt bei den Szenariobildern <code>' + bild + '</code> und klickt auf OK.<br>Steht in eurer Klasse oben <code>extends Hund</code>? Dann Rechtsklick auf die Klasse → Entfernen und neu anlegen.'
    ],
    attribute: [
      'Schaut in die Klasse <code>Hund</code>: Wo stehen dort die Attribute, und woraus besteht jede Zeile?',
      'Aus dem Klassendiagramm: Text → <code>String</code>, Zahl → <code>int</code>, Wahrheitswert → <code>boolean</code>.<br>Das erste Attribut eurer Klasse lautet: <code>' + ERSTES_ATTRIBUT[klasse] + '</code>'
    ],
    entscheidung: [
      'Lest die Beschreibung der Trainerin noch einmal. Welche Werte sind bei ' + w.jede + ' anders? Welche sind bei ' + w.jedeNeu + ' gleich?',
      'Was bei jedem Objekt anders ist, kommt als Parameter in die Klammer des Konstruktors – wie <code>pName</code> bei <code>Hund</code>.<br>Was bei allen neuen Objekten gleich ist, bekommt im Konstruktor einen festen Wert – wie <code>haltung = "steht";</code>'
    ],
    konstruktor: [
      'Vergleicht mit dem Konstruktor von <code>Hund</code>: Wie heißt er? Was steht in der runden Klammer? Was steht zwischen <code>{</code> und <code>}</code>?',
      'So ist er aufgebaut: <code>public ' + klasse + '(Datentyp pName, …)</code> – ohne <code>void</code>. In der Klammer steht für jeden Parameter der Datentyp und der Name mit p davor.<br>Zwischen <code>{ }</code> bekommt jedes Attribut einen Startwert: <code>attribut = pParameter;</code> oder <code>attribut = fester Wert;</code>'
    ],
    methoden: [
      'Schaut euch <code>sitzen()</code> in der Klasse <code>Hund</code> an: Welches Attribut verändert die Methode, und wie?',
      METHODEN_H2[klasse]
    ],
    testen: [
      'Übersetzt. Klickt dann mit der rechten Maustaste auf eure Klasse und wählt <code>new ' + klasse + '(…)</code>. Fragt Greenfoot genau nach den Werten, die bei ' + w.jede + ' anders sind?',
      'Setzt ' + w.zwei + ' auf den Platz. Rechtsklick auf ' + w.eine + ' → Methode aufrufen, dann Rechtsklick → Inspizieren.<br>Steht ein Attribut auf 0 oder <code>false</code>, obwohl ihr beim Erzeugen einen Wert eingegeben habt? Dann fehlt im Konstruktor eine Zeile wie <code>attribut = pParameter;</code>'
    ]
  };
  return t[thema][stufe - 1];
}
var FEHLERMELDUNGEN = [
  ["';' expected", 'Am Ende der Anweisung fehlt ein Semikolon – oft in der Zeile davor.'],
  ['cannot find symbol', 'Ein Name ist anders geschrieben als oben bei den Attributen (Groß- und Kleinschreibung, Umlaut) – oder <code>Int</code> statt <code>int</code>.'],
  ['reached end of file while parsing', 'Eine geschweifte Klammer <code>}</code> fehlt, meist am Ende der Klasse oder einer Methode.'],
  ['invalid method declaration; return type required', 'Vor dem Namen einer Methode fehlt <code>void</code> – oder der Konstruktor heißt nicht genau wie die Klasse.'],
  ['not a statement', 'Eine Rechnung steht allein, z. B. <code>hoehe + 10;</code>. Das Ergebnis muss einem Attribut zugewiesen werden.'],
  ['incompatible types: String cannot be converted to …', 'Ein Wert steht in Anführungszeichen, obwohl eine Zahl oder ein Wahrheitswert gemeint ist, z. B. <code>"false"</code> statt <code>false</code>.'],
  ["'(' expected", 'Hinter dem Namen einer Methode fehlen die runden Klammern <code>()</code>.']
];

if (location.pathname.replace(/\/+$/, '') === '/lehrkraft') lehrkraftApp(); else schuelerApp();

/* ================================================================== */
/* Lernende                                                            */
/* ================================================================== */
function schuelerApp() {
  if (window.__ohneServer || typeof window.io !== 'function') return keinServer();
  var socket = window.io({ transports: ['websocket', 'polling'] });
  var z = null;
  var pid = speicher.get('hw_pid');
  var verbunden = false;
  var app = $('#app');
  var formular = { namen: ['', '', ''], trio: false };

  function aktion(typ, d, cb) {
    d = d || {}; d.typ = typ; d.pid = pid;
    socket.emit('s:aktion', d, function (r) {
      if (r && r.fehler) toast(r.fehler, true);
      if (cb) cb(r || {});
    });
  }
  function hallo() {
    socket.emit('s:hallo', { pid: pid }, function (r) {
      if (!r || !r.ok) return;
      z = r.zustand;
      if (pid && !r.pid && !paar()) { /* Paar (noch) nicht vorhanden: z. B. nach Server-Neustart */ }
      zeichnen();
    });
  }
  socket.on('connect', function () { verbunden = true; hallo(); });
  socket.on('disconnect', function () { verbunden = false; zeichnen(); });
  socket.on('s:zustand', function (neu) { z = neu; zeichnen(); });

  function paar() { return z && pid ? z.paare.filter(function (p) { return p.id === pid; })[0] || null : null; }
  function gruppe(gid) { return z.gruppen.filter(function (g) { return g.id === gid; })[0] || null; }
  function paareIn(gid) { return z.paare.filter(function (p) { return p.gruppe === gid; }); }

  function kopf(p) {
    return '<header class="top"><h1>Hundeschule' + (p ? ' · ' + esc(namenText(p)) : '') + '</h1>' +
      (verbunden ? '' : '<span class="rolle Navigator">Verbindung wird hergestellt …</span>') +
      (p ? '<button class="linkbtn" id="abmelden">Das sind nicht wir</button>' : '') + '</header>';
  }

  function zeichnen() {
    if (!z) { app.innerHTML = kopf(null) + '<div class="big-msg"><p class="muted">Verbinde …</p></div>'; return; }
    // Fokus und Eingaben erhalten, wenn während des Tippens eine Aktualisierung kommt
    var fokus = document.activeElement && document.activeElement.id;
    $$('[data-name]').forEach(function (el) { formular.namen[+el.getAttribute('data-name')] = el.value; });
    var gname = $('#gname') ? $('#gname').value : '';
    var p = paar();
    app.innerHTML = kopf(p) + '<div class="wrap">' + (p ? paarAnsicht(p) : startAnsicht()) + '</div>';
    if ($('#gname')) $('#gname').value = gname;
    if (fokus && document.getElementById(fokus)) { var el = document.getElementById(fokus); el.focus(); if (el.setSelectionRange && el.value) el.setSelectionRange(el.value.length, el.value.length); }
    binden(p);
  }

  /* ---------- Start: eintragen oder Paar wählen ---------- */
  function startAnsicht() {
    var h = '<div class="card"><h2>Neu hier? Tragt euch als Paar ein</h2>' +
      '<p class="muted small">Nur Vornamen. Das Online-Tool lost aus, wer Driver und wer Navigator ist.</p>' +
      '<div class="row2"><label class="f">Name 1<input class="input" id="n0" data-name="0" maxlength="30" autocomplete="off" value="' + esc(formular.namen[0]) + '"></label>' +
      '<label class="f">Name 2<input class="input" id="n1" data-name="1" maxlength="30" autocomplete="off" value="' + esc(formular.namen[1]) + '"></label></div>' +
      (formular.trio ? '<label class="f">Name 3<input class="input" id="n2" data-name="2" maxlength="30" autocomplete="off" value="' + esc(formular.namen[2]) + '"></label>' : '') +
      '<div class="btns"><button class="btn primary" id="eintragen">Eintragen</button>' +
      '<button class="linkbtn" id="trio">' + (formular.trio ? 'Wir sind doch nur zu zweit' : 'Wir sind zu dritt') + '</button></div></div>';
    if (z.paare.length) {
      h += '<div class="card"><h2>Schon eingetragen?</h2><p class="muted small">Ihr sitzt heute an einem anderen Rechner? Wählt euer Paar.</p><div class="liste">' +
        z.paare.slice().sort(function (a, b) { return namenText(a).localeCompare(namenText(b), 'de'); }).map(function (q) {
          var g = q.gruppe ? gruppe(q.gruppe) : null;
          return '<button class="wahl" data-paar="' + q.id + '"><b>' + esc(namenText(q)) + '</b><span class="muted small">' + (g ? 'Gruppe ' + esc(g.name) : '') + '</span></button>';
        }).join('') + '</div></div>';
    }
    return h;
  }

  /* ---------- Ansicht eines Paares ---------- */
  function paarAnsicht(p) {
    var h = '';
    // Rollen
    h += '<div class="card"><h2>Eure Rollen</h2><div class="rollen">' + p.namen.map(function (n, i) {
      var r = p.rollen[i];
      return '<div class="rollenzeile"><span class="wer">' + esc(n) + '</span><div><span class="rolle ' + r + '">' + r + '</span><div class="was">' + BESCHREIBUNG[r] + '</div></div></div>';
    }).join('') + '</div>' +
      '<ul class="regeln"><li>Der Navigator diktiert keinen Code.</li><li>Der Driver denkt laut.</li><li>Entscheidungen trefft ihr gemeinsam.</li></ul>' +
      (z.tausch ? '<p class="small muted" style="margin-top:8px">Die Rollen wurden getauscht. Wer vorher Navigator war, ist jetzt Driver.</p>' : '') + '</div>';

    // Gruppe
    var g = p.gruppe ? gruppe(p.gruppe) : null;
    if (!g) {
      h += '<div class="card"><h2>Eure Gruppe</h2>';
      if (!z.freigabe.gruppen) {
        h += '<p class="muted">Ihr seid noch in keiner Gruppe. Meldet euch bei eurer Lehrkraft.</p></div>';
      } else {
        h += '<p class="muted small">Eine Gruppe besteht aus drei Paaren. Gründet eine Gruppe oder tretet einer bei.</p>' +
          '<label class="f">Neue Gruppe gründen<input class="input" id="gname" maxlength="30" placeholder="Name der Gruppe" autocomplete="off"></label>' +
          '<div class="btns" style="margin-top:0"><button class="btn primary" id="gruenden">Gruppe gründen</button></div>';
        var frei = z.gruppen.filter(function (x) { return paareIn(x.id).length < 3; });
        if (frei.length) {
          h += '<h2 style="margin-top:16px">… oder einer Gruppe beitreten</h2><div class="liste">' + frei.map(function (x) {
            var ps = paareIn(x.id);
            return '<button class="wahl" data-beitreten="' + x.id + '"><b>' + esc(x.name) + '</b><span class="muted small">' +
              esc(ps.map(namenText).join(' · ')) + ' (' + ps.length + ' von 3 Paaren)</span></button>';
          }).join('') + '</div>';
        }
        h += '</div>';
      }
      return h;
    }

    var ps = paareIn(g.id);
    var freitag = z.freigabe.wahl || z.freigabe.abgabe || z.freigabe.download || ps.some(function (q) { return q.klasse; });

    // Arbeitsphase beendet: gemeinsames Szenario zuerst
    if (z.freigabe.download) h += downloadKarte(p, g, ps);

    h += '<div class="card"><h2>Gruppe ' + esc(g.name) + '</h2><table class="gtab"><tr><th>Paar</th>' + (freitag ? '<th>Hindernis</th><th>Hochgeladen</th>' : '') + '</tr>' +
      ps.map(function (q) {
        var k = q.klasse ? klasseInfo(z, q.klasse) : null;
        return '<tr class="' + (q.id === p.id ? 'ich' : '') + '"><td>' + rollenHTML(q) + '</td>' + (freitag ? '<td>' + (k ? '<img class="symbol" src="/bild/' + esc(k.bild) + '" alt="">' + esc(k.anzeige) : '<span class="offen">–</span>') +
          '</td><td>' + (q.abgegeben ? '<span class="haken">✓</span> ' + uhr(q.codeZeit) : '<span class="offen">noch nicht</span>') + '</td>' : '') + '</tr>';
      }).join('') + '</table>' +
      (ps.length < 3 ? '<p class="small muted" style="margin-top:8px">Es fehlen noch ' + (3 - ps.length) + ' Paar(e).</p>' : '') +
      (z.freigabe.gruppen && !p.abgegeben ? '<div class="btns"><button class="linkbtn" id="verlassen">Gruppe verlassen</button></div>' : '') + '</div>';

    // Hindernis wählen
    if (z.freigabe.wahl || p.klasse) {
      h += '<div class="card"><h2>Euer Hindernis</h2>';
      if (z.freigabe.wahl && !p.klasse) h += '<p class="muted small">Wählt ein Hindernis. In eurer Gruppe programmiert jedes Paar ein anderes.</p>';
      h += '<div class="geraete">' + z.klassen.map(function (k) {
        var andere = ps.filter(function (q) { return q.id !== p.id && q.klasse === k.name; })[0];
        var mein = p.klasse === k.name;
        var aus = !z.freigabe.wahl || !!andere || (p.abgegeben && !mein);
        return '<button class="geraet' + (mein ? ' mein' : '') + '" data-hindernis="' + k.name + '"' + (aus && !mein ? ' disabled' : '') + '>' +
          '<img src="/bild/' + esc(k.bild) + '" alt=""><b>' + esc(k.anzeige) + '</b><span class="small muted">' + esc(k.info) + '</span>' +
          '<span class="wer">' + (mein ? 'euer Hindernis' : andere ? esc(namenText(andere)) : '') + '</span></button>';
      }).join('') + '</div>';
      if (p.klasse) {
        var kk = klasseInfo(z, p.klasse);
        h += '<p style="margin-top:12px"><b>Navigator:</b> Holt das Aufgabenblatt mit diesem Symbol aus der Mitte.</p>' +
          '<p class="small">Eure Klasse heißt genau <code>' + esc(p.klasse) + '</code>, das Bild ist <code>' + esc(kk ? kk.bild : '') + '</code>.</p>';
      }
      h += '</div>';
    }

    // Hilfen und Hochladen nur während der Arbeitsphase
    if (p.klasse && !z.freigabe.download) {
      h += hilfenKarte(p);
      h += '<div class="card"><h2>Quelltext hochladen</h2>';
      if (!z.freigabe.abgabe) {
        h += '<p class="muted">Das Hochladen ist noch nicht freigegeben.</p>';
      } else {
        h += '<p class="small muted">Erst hochladen, wenn eure Klasse in Greenfoot ohne Fehlermeldung übersetzt. Ihr könnt jederzeit eine neue Fassung hochladen, bis die Arbeitsphase endet.</p>' +
          (p.abgegeben ? '<p class="okbox">Hochgeladen um ' + uhr(p.codeZeit) + ' Uhr.</p>' : '');
      }
      h += '<div class="btns"><button class="btn ' + (p.abgegeben ? '' : 'primary') + '" id="hochladen"' + (z.freigabe.abgabe ? '' : ' disabled') + '>' + (p.abgegeben ? 'Neue Fassung hochladen' : 'Quelltext hochladen') + '</button></div></div>';
    }
    return h;
  }

  function hilfenKarte(p) {
    var k = klasseInfo(z, p.klasse);
    var stand = p.hilfen || {};
    var h = '<div class="card"><h2>Hilfen</h2><p class="small muted">Erst selbst überlegen, dann Hilfe 1. Hilfe 2 gibt es erst, wenn ihr Hilfe 1 gelesen habt.</p>';
    h += THEMEN.map(function (t) {
      var st = stand[t.id] || 0;
      return '<div class="hilfe"><div class="kopf"><b>' + esc(t.titel) + '</b>' +
        '<button class="mini" data-hilfe="' + t.id + '" data-stufe="1"' + (st >= 1 ? ' disabled' : '') + '>Hilfe 1</button>' +
        '<button class="mini" data-hilfe="' + t.id + '" data-stufe="2"' + (st >= 1 && st < 2 ? '' : ' disabled') + '>Hilfe 2</button></div>' +
        (st >= 1 ? '<div class="txt">' + hilfeText(p.klasse, k ? k.bild : '', t.id, 1) + '</div>' : '') +
        (st >= 2 ? '<div class="txt h2">' + hilfeText(p.klasse, k ? k.bild : '', t.id, 2) + '</div>' : '') + '</div>';
    }).join('');
    h += '<details class="fm"><summary>Fehlermeldungen in Greenfoot</summary><table class="fmtab">' +
      FEHLERMELDUNGEN.map(function (f) { return '<tr><td>' + esc(f[0]) + '</td><td>' + f[1] + '</td></tr>'; }).join('') + '</table></details></div>';
    return h;
  }

  function downloadKarte(p, g, ps) {
    var anzahl = ps.filter(function (q) { return q.abgegeben; }).length;
    var h = '<div class="card"><h2>Die Arbeitsphase ist beendet</h2>';
    if (!anzahl) return h + '<p class="note">Aus eurer Gruppe hat niemand einen Quelltext hochgeladen. Meldet euch bei eurer Lehrkraft.</p></div>';
    h += '<p>Im Szenario eurer Gruppe sind die Klassen von ' + anzahl + ' von ' + ps.length + ' Paaren.</p>' +
      '<ol class="small" style="margin:0 0 10px;padding-left:1.3em"><li>Einer von euch lädt das Szenario herunter.</li><li>Datei in Greenfoot öffnen (Szenario → Öffnen) und auf Übersetzen klicken.</li>' +
      '<li>Setzt euch als Gruppe an diesen Rechner. Was ihr dann macht, steht am Beamer.</li></ol>' +
      '<div class="btns"><a class="btn ok" href="/szenario/' + g.id + '?p=' + p.id + '" download>Szenario herunterladen (.gfar)</a></div></div>';
    return h;
  }

  function binden(p) {
    var ab = $('#abmelden');
    if (ab) ab.addEventListener('click', function () {
      if (!confirm('Auf diesem Rechner abmelden? Euer Paar bleibt gespeichert.')) return;
      pid = null; speicher.del('hw_pid'); zeichnen();
    });
    var tr = $('#trio');
    if (tr) tr.addEventListener('click', function () { formular.trio = !formular.trio; zeichnen(); });
    var ein = $('#eintragen');
    if (ein) ein.addEventListener('click', function () { eintragen(false); });
    $$('[data-name]').forEach(function (el) { el.addEventListener('keydown', function (e) { if (e.key === 'Enter') eintragen(false); }); });
    $$('[data-paar]').forEach(function (b) {
      b.addEventListener('click', function () {
        var q = z.paare.filter(function (x) { return x.id === b.getAttribute('data-paar'); })[0];
        if (!q || !confirm('Seid ihr ' + namenText(q) + '?')) return;
        waehlen(q.id);
      });
    });
    var gr = $('#gruenden');
    if (gr) {
      var los = function () { aktion('gruppeGruenden', { name: $('#gname').value }); };
      gr.addEventListener('click', los);
      $('#gname').addEventListener('keydown', function (e) { if (e.key === 'Enter') los(); });
    }
    $$('[data-beitreten]').forEach(function (b) { b.addEventListener('click', function () { aktion('gruppeBeitreten', { gid: b.getAttribute('data-beitreten') }); }); });
    var vl = $('#verlassen');
    if (vl) vl.addEventListener('click', function () { if (confirm('Wollt ihr die Gruppe wirklich verlassen?')) aktion('gruppeVerlassen'); });
    $$('[data-hindernis]').forEach(function (b) {
      b.addEventListener('click', function () { if (z.freigabe.wahl && p.klasse !== b.getAttribute('data-hindernis')) aktion('hindernisWaehlen', { klasse: b.getAttribute('data-hindernis') }); });
    });
    $$('[data-hilfe]').forEach(function (b) {
      b.addEventListener('click', function () { aktion('hilfe', { thema: b.getAttribute('data-hilfe'), stufe: +b.getAttribute('data-stufe') }); });
    });
    var hl = $('#hochladen');
    if (hl) hl.addEventListener('click', function () { hochladen(p); });
  }

  function eintragen(trotzdem) {
    var namen = $$('[data-name]').map(function (el) { return el.value.trim(); }).filter(Boolean);
    aktion('eintragen', { namen: namen, trotzdem: trotzdem }, function (r) {
      if (r.doppelt) {
        if (confirm('Es gibt schon ein Paar mit diesen Namen. Seid ihr das?')) return waehlen(r.doppelt);
        if (confirm('Wirklich ein zweites Paar mit denselben Namen eintragen?')) return eintragen(true);
        return;
      }
      if (r.ok && r.pid) { pid = r.pid; speicher.set('hw_pid', pid); formular = { namen: ['', '', ''], trio: false }; zeichnen(); }
    });
  }
  function waehlen(id) {
    pid = id; // vorläufig, damit aktion() es mitschickt
    aktion('waehlen', { pid: id }, function (r) {
      if (r.ok) { speicher.set('hw_pid', id); zeichnen(); } else { pid = null; }
    });
  }

  function hochladen(p) {
    var d = dialog('<h2>Quelltext der Klasse ' + esc(p.klasse) + ' hochladen</h2>' +
      '<p class="small muted">Im Greenfoot-Editor: Strg + A (alles markieren), Strg + C (kopieren). Hier: Strg + V (einfügen).</p>' +
      '<textarea id="qt" spellcheck="false" placeholder="public class ' + esc(p.klasse) + ' extends Actor ..."></textarea>' +
      '<div id="qfehler"></div><div class="btns"><button class="btn primary" id="qok">Hochladen</button><button class="btn" id="qab">Abbrechen</button></div>');
    $('#qt', d).focus();
    $('#qab', d).addEventListener('click', function () { d.remove(); });
    $('#qok', d).addEventListener('click', function () {
      socket.emit('s:aktion', { typ: 'abgeben', pid: pid, quelltext: $('#qt', d).value }, function (r) {
        if (r && r.ok && r.hinweis) {
          d.querySelector('.card').innerHTML = '<h2>Hochgeladen</h2><p class="okbox">Euer Quelltext ist hochgeladen.</p><p class="note">Hinweis: ' + esc(r.hinweis) + '</p>' +
            '<div class="btns"><button class="btn primary" id="qzu">OK</button></div>';
          $('#qzu', d).addEventListener('click', function () { d.remove(); });
          return;
        }
        if (r && r.ok) { d.remove(); toast('Hochgeladen.'); return; }
        $('#qfehler', d).innerHTML = '<div class="fehler">' + esc((r && r.fehler) || 'Das hat nicht geklappt.') + '</div>';
      });
    });
  }
}

/* ================================================================== */
/* Lehrkraft                                                           */
/* ================================================================== */
function lehrkraftApp() {
  document.body.classList.add('lk');
  if (window.__ohneServer || typeof window.io !== 'function') return keinServer();
  var socket = window.io({ transports: ['websocket', 'polling'] });
  var app = $('#app');
  var token = null, z = null, cfg = null, menuOffen = false;
  if (speicher.get('hw_beamer') === '1') document.body.classList.add('beamer');

  fetch('/config.json').then(function (r) { return r.json(); }).then(function (c) { cfg = c; anmelden(); }).catch(function () { cfg = { passwortNoetig: true }; anmelden(); });
  socket.on('connect', function () { if (cfg) anmelden(); });
  socket.on('lk:zustand', function (neu) { z = neu; sichern(); zeichnen(); });

  function sichern() {
    if (!z) return;
    if (!z.paare.length && !z.gruppen.length) return; // leeren Stand nicht über eine gute Sicherung schreiben
    speicher.setJSON('hw_snap', { gespeichert: Date.now(), sicherung: sicherungAus(z) });
  }
  function sicherungAus(s) {
    return {
      freigabe: s.freigabe, abgabeBis: s.abgabeBis, tausch: s.tausch,
      gruppen: s.gruppen.map(function (g) { return { id: g.id, name: g.name, seit: g.seit }; }),
      paare: s.paare.map(function (p) { return { id: p.id, namen: p.namen, rollen: p.rollen, gruppe: p.gruppe, klasse: p.klasse, code: p.code, codeZeit: p.codeZeit, hilfen: p.hilfen || {}, seit: p.seit }; })
    };
  }

  function anmelden(pwNeu) {
    var pw = pwNeu != null ? pwNeu : (speicher.get('hw_pw') || '');
    if (cfg.passwortNoetig && !pw) return loginZeigen();
    socket.emit('lk:anmelden', { passwort: pw }, function (r) {
      if (!r || !r.ok) { if (pwNeu != null) toast((r && r.fehler) || 'Anmeldung fehlgeschlagen.', true); return loginZeigen(); }
      speicher.set('hw_pw', pw);
      token = r.token; z = r.zustand;
      var snap = speicher.getJSON('hw_snap', null);
      if (r.leer && snap && snap.sicherung && (snap.sicherung.paare.length || snap.sicherung.gruppen.length)) {
        aktion({ typ: 'wiederherstellen', sicherung: snap.sicherung }, function (r2) {
          if (r2 && r2.ok) toast('Der Stand vom ' + new Date(snap.gespeichert).toLocaleString('de-DE') + ' wurde wiederhergestellt.');
        });
      }
      zeichnen();
    });
  }
  function loginZeigen() {
    app.innerHTML = '<div class="wrap" style="max-width:480px"><div class="card"><h2>Hundeschule · Lehrkraft</h2>' +
      '<label class="f">Passwort<input class="input" type="password" id="pw" autocomplete="current-password"></label>' +
      '<div class="btns"><button class="btn primary" id="login">Anmelden</button></div>' +
      '<p class="small muted" style="margin-top:12px">Der kostenlose Server bei Render braucht nach einer Pause bis zu einer Minute zum Aufwachen.</p></div></div>';
    var los = function () { anmelden($('#pw').value); };
    $('#login').addEventListener('click', los);
    $('#pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') los(); });
    $('#pw').focus();
  }
  function aktion(d, cb) {
    d.token = token;
    socket.emit('lk:aktion', d, function (r) {
      if (r && !r.ok && r.fehler) { toast(r.fehler, true); if (r.fehler === 'Bitte neu anmelden.') anmelden(); }
      if (cb) cb(r);
    });
  }

  function gruppeVon(gid) { return z.gruppen.filter(function (g) { return g.id === gid; })[0] || null; }
  function paareIn(gid) { return z.paare.filter(function (p) { return p.gruppe === gid; }); }

  function zeichnen() {
    if (!z || !token) return;
    var url = location.origin + '/';
    var ohne = paareIn(null);
    var abg = z.paare.filter(function (p) { return p.code; }).length;
    var schalter = function (was, label) {
      return '<span class="schalter' + (z.freigabe[was] ? ' an' : '') + '" data-schalter="' + was + '"><span class="pkt"></span>' + label + '</span>';
    };
    var phase = z.freigabe.download ? 'Arbeitsphase beendet – Download offen' : z.freigabe.abgabe ? 'Arbeitsphase – Hochladen offen' :
      z.freigabe.wahl ? 'Hindernisse wählen' : z.freigabe.gruppen ? 'Paare und Gruppen eintragen' : '';
    var h = '<header class="top"><h1>Hundeschule · Lehrkraft</h1>' +
      '<button class="btn" id="beamer">' + (document.body.classList.contains('beamer') ? 'Verwaltung' : 'Beameransicht') + '</button>' +
      '<div class="menu nurlk"><button class="btn" id="menuBtn">☰ Mehr</button>' + (menuOffen ?
        '<div class="pop"><button id="mDown">Sicherung herunterladen (.json)</button><button id="mUp">Sicherung laden …</button>' +
        '<button id="mGruppe">Neue Gruppe anlegen …</button><button id="mAlles" style="color:var(--bad)">Alles löschen</button></div>' : '') +
      '</div></header><div class="wrap">';

    h += '<div class="card"><div class="small muted">Adresse für die Schülerinnen und Schüler</div><div class="url">' + esc(url) + '</div>' +
      (phase ? '<div style="margin-top:8px"><span class="phase">' + esc(phase) + '</span></div>' : '') +
      '<div class="lkbar nurlk" style="margin-top:12px">' + schalter('gruppen', 'Gruppenwahl offen') + schalter('wahl', 'Hinderniswahl offen') + schalter('abgabe', 'Hochladen offen') + schalter('download', 'Download offen') +
      (z.freigabe.download ? '' : '<button class="btn primary" id="ende">Arbeitsphase beenden</button>') +
      '<button class="btn" id="tausch">Rollen tauschen</button>' +
      '<span class="small muted">' + (z.tausch ? 'Rollen ' + z.tausch + '× getauscht' : 'Rollen noch nicht getauscht') + '</span></div>' +
      '<div class="stat" style="margin-top:10px"><span><b>' + z.paare.length + '</b> Paare</span><span><b>' + z.gruppen.length + '</b> Gruppen</span>' +
      '<span><b>' + ohne.length + '</b> ohne Gruppe</span><span><b>' + z.paare.filter(function (p) { return p.klasse; }).length + '</b> mit Hindernis</span><span><b>' + abg + '</b> von ' + z.paare.length + ' hochgeladen</span></div></div>';

    h += '<div class="gcards">' + z.gruppen.map(gruppenKarte).join('') + '</div>';
    if (ohne.length) {
      h += '<div class="card"><h2>Ohne Gruppe</h2>' + ohne.map(function (p) { return paarZeile(p, null); }).join('') + '</div>';
    }
    if (!z.paare.length) h += '<div class="card"><p class="muted">Noch keine Paare eingetragen.</p></div>';
    h += '</div>';
    app.innerHTML = h;
    binden();
  }

  function gruppenKarte(g) {
    var ps = paareIn(g.id);
    var abg = ps.filter(function (p) { return p.code; }).length;
    var pz = ps.length ? Math.round(abg / ps.length * 100) : 0;
    return '<div class="card gcard"><h3><span class="gname" data-umbenennen="' + g.id + '" title="Umbenennen">' + esc(g.name) + '</span>' +
      '<span class="small muted">' + ps.length + ' von 3 Paaren</span></h3>' +
      '<div class="small muted">' + abg + ' von ' + ps.length + ' hochgeladen</div><div class="fortschritt"><span style="width:' + pz + '%"></span></div>' +
      '<div>' + ps.map(function (p) { return paarZeile(p, g); }).join('') + '</div>' +
      '<div class="btns nurlk"><a class="mini" href="/szenario/' + g.id + '?t=' + token + '" download>.gfar herunterladen</a>' +
      '<button class="mini bad" data-gloeschen="' + g.id + '">Gruppe auflösen</button></div></div>';
  }

  function paarZeile(p, g) {
    var k = p.klasse ? z.klassen.filter(function (x) { return x.name === p.klasse; })[0] : null;
    var gopts = '<option value="">– ohne Gruppe –</option>' + z.gruppen.map(function (x) {
      return '<option value="' + x.id + '"' + (x.id === p.gruppe ? ' selected' : '') + '>' + esc(x.name) + '</option>';
    }).join('');
    var kopts = '<option value="">– Hindernis –</option>' + z.klassen.map(function (x) {
      return '<option value="' + x.name + '"' + (x.name === p.klasse ? ' selected' : '') + '>' + esc(x.anzeige) + '</option>';
    }).join('');
    var hz = 0; Object.keys(p.hilfen || {}).forEach(function (t) { hz += p.hilfen[t]; });
    var status = p.code ? '<button class="mini" data-code="' + p.id + '"><span class="haken">✓</span> ' + uhr(p.codeZeit) + '</button>' : '<span class="offen small">nicht hochgeladen</span>';
    var namen = p.namen.map(function (n, i) { return '<span class="pn">' + esc(n) + ' <span class="rolle ' + p.rollen[i] + '">' + p.rollen[i] + '</span></span>'; }).join('');
    return '<div class="prow"><div class="pnamen">' + namen + '</div><div class="pctl">' +
      (g ? '<select class="nurlk" data-klasse="' + p.id + '">' + kopts + '</select>' +
        '<span class="nurbeamer">' + (k ? '<img class="symbol" src="/bild/' + esc(k.bild) + '" alt="">' + esc(k.anzeige) : '') + '</span>' + status +
        (hz ? '<span class="nurlk small muted" title="geöffnete Hilfen (Hilfe 1 zählt 1, Hilfe 2 zählt 2)">Hilfen: ' + hz + '</span>' : '') : '') +
      '<span class="nurlk rechts"><select data-gruppe="' + p.id + '" title="Gruppe">' + gopts + '</select>' +
      '<button class="mini" data-rollen="' + p.id + '" title="Rollen neu auslosen">🎲</button>' +
      '<button class="mini bad" data-ploeschen="' + p.id + '" title="Paar löschen">✕</button></span></div></div>';
  }

  function binden() {
    $('#beamer').addEventListener('click', function () {
      document.body.classList.toggle('beamer');
      speicher.set('hw_beamer', document.body.classList.contains('beamer') ? '1' : '0');
      zeichnen();
    });
    $('#menuBtn').addEventListener('click', function (e) { e.stopPropagation(); menuOffen = !menuOffen; zeichnen(); });
    if (menuOffen) {
      document.addEventListener('click', function zu() { menuOffen = false; document.removeEventListener('click', zu); zeichnen(); }, { once: true });
      $('#mDown').addEventListener('click', herunterladen);
      $('#mUp').addEventListener('click', hochladen);
      $('#mGruppe').addEventListener('click', function () { var n = prompt('Name der neuen Gruppe:'); if (n) aktion({ typ: 'gruppeNeu', name: n }); });
      $('#mAlles').addEventListener('click', function () {
        if (!confirm('Wirklich alle Paare, Gruppen und Abgaben löschen? Lade vorher eine Sicherung herunter, wenn du sie noch brauchst.')) return;
        speicher.del('hw_snap');
        aktion({ typ: 'allesLoeschen' });
      });
    }
    $$('[data-schalter]').forEach(function (el) {
      el.addEventListener('click', function () { var w = el.getAttribute('data-schalter'); aktion({ typ: 'freigabe', was: w, an: !z.freigabe[w] }); });
    });
    var ende = $('#ende');
    if (ende) ende.addEventListener('click', function () {
      if (confirm('Arbeitsphase beenden? Hochladen und Hinderniswahl werden geschlossen, die Gruppen können ihr Szenario herunterladen.')) aktion({ typ: 'arbeitsphaseBeenden' });
    });
    var t = $('#tausch');
    if (t) t.addEventListener('click', function () {
      if (confirm('Rollen bei allen Paaren tauschen? Navigator wird Driver, Driver wird Navigator (im Trio rotieren die drei Rollen).')) aktion({ typ: 'rollenTauschen' });
    });
    $$('[data-umbenennen]').forEach(function (el) {
      el.addEventListener('click', function () {
        if (document.body.classList.contains('beamer')) return;
        var g = gruppeVon(el.getAttribute('data-umbenennen'));
        var n = prompt('Neuer Name der Gruppe:', g ? g.name : '');
        if (n) aktion({ typ: 'gruppeUmbenennen', gid: g.id, name: n });
      });
    });
    $$('[data-gloeschen]').forEach(function (b) {
      b.addEventListener('click', function () { if (confirm('Gruppe auflösen? Die Paare bleiben erhalten, ihre Abgaben werden gelöscht.')) aktion({ typ: 'gruppeLoeschen', gid: b.getAttribute('data-gloeschen') }); });
    });
    $$('[data-gruppe]').forEach(function (s) {
      s.addEventListener('change', function () {
        var p = z.paare.filter(function (x) { return x.id === s.getAttribute('data-gruppe'); })[0];
        if (p && p.code && !confirm('Das Paar hat schon abgegeben. Beim Wechsel wird die Abgabe gelöscht. Fortfahren?')) return zeichnen();
        aktion({ typ: 'paarGruppe', pid: s.getAttribute('data-gruppe'), gid: s.value || null });
      });
    });
    $$('[data-klasse]').forEach(function (s) {
      s.addEventListener('change', function () {
        var p = z.paare.filter(function (x) { return x.id === s.getAttribute('data-klasse'); })[0];
        if (p && p.code && !confirm('Das Paar hat schon abgegeben. Beim Wechsel des Hindernisses wird die Abgabe gelöscht. Fortfahren?')) return zeichnen();
        aktion({ typ: 'paarKlasse', pid: s.getAttribute('data-klasse'), klasse: s.value || null });
      });
    });
    $$('[data-rollen]').forEach(function (b) { b.addEventListener('click', function () { aktion({ typ: 'paarRollen', pid: b.getAttribute('data-rollen') }); }); });
    $$('[data-ploeschen]').forEach(function (b) {
      b.addEventListener('click', function () {
        var p = z.paare.filter(function (x) { return x.id === b.getAttribute('data-ploeschen'); })[0];
        if (p && confirm('Paar ' + namenText(p) + ' löschen?')) aktion({ typ: 'paarLoeschen', pid: p.id });
      });
    });
    $$('[data-code]').forEach(function (b) {
      b.addEventListener('click', function () {
        var p = z.paare.filter(function (x) { return x.id === b.getAttribute('data-code'); })[0];
        if (!p) return;
        var d = dialog('<h2>' + esc(p.klasse) + ' · ' + esc(namenText(p)) + ' · ' + uhr(p.codeZeit) + ' Uhr</h2><pre>' + esc(p.code) + '</pre>' +
          '<div class="btns"><button class="btn" id="dz">Schließen</button><button class="btn bad nurlk" id="dl">Abgabe löschen</button></div>');
        $('#dz', d).addEventListener('click', function () { d.remove(); });
        $('#dl', d).addEventListener('click', function () { if (confirm('Abgabe löschen?')) { aktion({ typ: 'codeLoeschen', pid: p.id }); d.remove(); } });
      });
    });
  }

  function herunterladen() {
    var blob = new Blob([JSON.stringify(sicherungAus(z), null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    var d = new Date();
    a.href = URL.createObjectURL(blob);
    a.download = 'Hundeschule_' + d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2) + '_' + ('0' + d.getHours()).slice(-2) + ('0' + d.getMinutes()).slice(-2) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
  }
  function hochladen() {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.addEventListener('change', function () {
      var f = inp.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        var s;
        try { s = JSON.parse(r.result); } catch (e) { return toast('Die Datei ist keine gültige Sicherung.', true); }
        var ersetzen = !!(z.paare.length || z.gruppen.length);
        if (ersetzen && !confirm('Der aktuelle Stand wird durch die Sicherung ersetzt. Fortfahren?')) return;
        aktion({ typ: 'wiederherstellen', sicherung: s, ersetzen: ersetzen }, function (r2) { if (r2 && r2.ok) toast('Sicherung geladen.'); });
      };
      r.readAsText(f);
    });
    inp.click();
  }
}
})();
</script>
</body>
</html>
